<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Film Itineraries</title>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:      #0d0d0d;
      --surface: #161616;
      --border:  #2a2a2a;
      --accent:  #e8c86e;
      --accent2: #c75e3a;
      --text:    #d4cfc8;
      --muted:   #7a756e;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Georgia', serif;
      min-height: 100vh;
      padding: 60px 24px;
    }

    /* ── Header ── */
    header {
      max-width: 760px;
      margin: 0 auto 52px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 32px;
    }

    .site-eyebrow {
      font-family: 'Courier New', monospace;
      font-size: 11px;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 12px;
    }

    h1 {
      font-size: 28px;
      font-weight: normal;
      color: #fff;
      line-height: 1.25;
      letter-spacing: 0.01em;
    }

    .site-desc {
      margin-top: 10px;
      font-size: 14px;
      color: var(--muted);
      line-height: 1.7;
    }

    /* ── Grid ── */
    #itinerary-list {
      max-width: 760px;
      margin: 0 auto;
      display: grid;
      gap: 16px;
    }

    /* ── Card ── */
    .itinerary-card {
      display: block;
      text-decoration: none;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 24px 28px;
      transition: border-color 0.15s, background 0.15s;
    }

    .itinerary-card:hover {
      border-color: var(--accent);
      background: rgba(232, 200, 110, 0.04);
    }

    .card-city {
      font-family: 'Courier New', monospace;
      font-size: 10px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 8px;
    }

    .card-title {
      font-size: 18px;
      color: #fff;
      font-weight: normal;
      line-height: 1.3;
      margin-bottom: 16px;
    }

    .card-meta {
      display: flex;
      gap: 24px;
    }

    .card-meta-item {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .card-meta-label {
      font-family: 'Courier New', monospace;
      font-size: 10px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .card-meta-value {
      font-family: 'Courier New', monospace;
      font-size: 13px;
      color: var(--accent);
    }

    .card-arrow {
      float: right;
      font-size: 18px;
      color: var(--muted);
      transition: color 0.15s, transform 0.15s;
      margin-top: 2px;
    }

    .itinerary-card:hover .card-arrow {
      color: var(--accent);
      transform: translateX(4px);
    }

    /* ── Empty / error state ── */
    .state-msg {
      font-family: 'Courier New', monospace;
      font-size: 13px;
      color: var(--muted);
      padding: 32px 0;
    }

    /* ── Responsive ── */
    @media (max-width: 560px) {
      body { padding: 36px 16px; }
      h1 { font-size: 22px; }
      .card-meta { gap: 16px; flex-wrap: wrap; }
    }
  </style>
</head>
<body>

<header>
  <div class="site-eyebrow">Film Itineraries</div>
  <h1>Walk through cinema</h1>
  <p class="site-desc">Self-guided walks through the real locations where films were made.</p>
</header>

<div id="itinerary-list">
  <p class="state-msg">Loading itineraries&hellip;</p>
</div>

<script>
(async () => {
  const list = document.getElementById('itinerary-list');

  let itineraries;
  try {
    const res = await fetch('itineraries.json');
    if (!res.ok) throw new Error();
    itineraries = await res.json();
  } catch {
    list.innerHTML = '<p class="state-msg">Could not load itineraries.json</p>';
    return;
  }

  if (!itineraries.length) {
    list.innerHTML = '<p class="state-msg">No itineraries yet.</p>';
    return;
  }

  list.innerHTML = '';
  itineraries.forEach(it => {
    const a = document.createElement('a');
    a.className = 'itinerary-card';
    a.href = `itinerary.html?walk=${encodeURIComponent(it.file)}`;
    a.innerHTML = `
      <span class="card-arrow">&#8594;</span>
      <div class="card-city">${it.city}</div>
      <div class="card-title">${it.walk_name}</div>
      <div class="card-meta">
        <div class="card-meta-item">
          <span class="card-meta-label">Duration</span>
          <span class="card-meta-value">${it.duration_minutes} min</span>
        </div>
        <div class="card-meta-item">
          <span class="card-meta-label">Distance</span>
          <span class="card-meta-value">${it.distance_km} km</span>
        </div>
        <div class="card-meta-item">
          <span class="card-meta-label">Stops</span>
          <span class="card-meta-value">${it.stops}</span>
        </div>
      </div>
    `;
    list.appendChild(a);
  });
})();
</script>

</body>
</html>
