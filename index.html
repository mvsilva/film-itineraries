<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Film Itineraries</title>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:      #f4efe6;
      --surface: #ede7db;
      --border:  #d4c9b8;
      --accent:  #8c6d2f;   /* dark amber */
      --accent2: #8b3a20;   /* deep terracotta */
      --text:    #2e2820;
      --muted:   #9a9088;
    }

    html, body {
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: 'Georgia', serif;
    }

    /* ── Film grain overlay ─────────────────────────────────────── */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 100;
      opacity: 0.018;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
      background-size: 200px 200px;
    }

    /* ── Hero ───────────────────────────────────────────────────── */
    .hero {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 0 24px;
      min-height: 38vh;
      overflow: hidden;
    }

    /* letterbox bars */
    .hero::before,
    .hero::after {
      content: '';
      position: absolute;
      left: 0; right: 0;
      height: 28px;
      background: #000;
      z-index: 1;
    }
    .hero::before { top: 0; }
    .hero::after  { bottom: 0; }

    .hero-inner {
      position: relative;
      z-index: 2;
      padding: 48px 0 44px;
    }

    .hero-eyebrow {
      font-family: 'Courier New', monospace;
      font-size: 10px;
      letter-spacing: 0.36em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 20px;
    }

    .hero h1 {
      font-size: clamp(32px, 5vw, 54px);
      font-weight: normal;
      color: #fff;
      letter-spacing: 0.03em;
      line-height: 1.15;
    }

    .hero-rule {
      width: 40px;
      height: 1px;
      background: var(--accent);
      margin: 22px auto 20px;
    }

    .hero-desc {
      font-size: 13px;
      color: var(--muted);
      letter-spacing: 0.06em;
      font-family: 'Courier New', monospace;
    }

    /* ── List container ─────────────────────────────────────────── */
    #itinerary-list {
      max-width: 820px;
      margin: 56px auto 80px;
      padding: 0 24px;
    }

    /* ── Card ───────────────────────────────────────────────────── */
    .itinerary-card {
      display: grid;
      grid-template-columns: 56px 1fr auto;
      align-items: center;
      gap: 0 28px;
      text-decoration: none;
      padding: 28px 0;
      border-bottom: 1px solid var(--border);
      opacity: 0;
      transform: translateY(12px);
      animation: fadeUp 0.5s ease forwards;
    }

    .itinerary-card:first-child { border-top: 1px solid var(--border); }

    @keyframes fadeUp {
      to { opacity: 1; transform: translateY(0); }
    }

    .itinerary-card:hover .card-num   { color: var(--accent); }
    .itinerary-card:hover .card-title { color: var(--text); }
    .itinerary-card:hover .card-arrow { color: var(--accent); transform: translateX(5px); }

    /* number */
    .card-num {
      font-family: 'Courier New', monospace;
      font-size: 22px;
      color: var(--border);
      letter-spacing: -0.02em;
      text-align: right;
      line-height: 1;
      transition: color 0.2s;
      padding-top: 2px;
    }

    /* main content */
    .card-body { min-width: 0; }

    .card-city {
      font-family: 'Courier New', monospace;
      font-size: 10px;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 6px;
    }

    .card-title {
      font-size: 20px;
      color: var(--text);
      font-weight: normal;
      line-height: 1.25;
      margin-bottom: 12px;
      transition: color 0.2s;
    }

    .card-meta {
      display: flex;
      gap: 20px;
      flex-wrap: wrap;
    }

    .card-meta-item {
      font-family: 'Courier New', monospace;
      font-size: 11px;
      color: var(--muted);
      letter-spacing: 0.06em;
    }

    .card-meta-sep {
      color: var(--border);
    }

    /* arrow */
    .card-arrow {
      font-size: 20px;
      color: var(--border);
      transition: color 0.2s, transform 0.2s;
      flex-shrink: 0;
    }

    /* ── Empty / error state ── */
    .state-msg {
      font-family: 'Courier New', monospace;
      font-size: 13px;
      color: var(--muted);
      padding: 32px 0;
    }

    /* ── Responsive ── */
    @media (max-width: 560px) {
      .itinerary-card { grid-template-columns: 40px 1fr auto; gap: 0 16px; }
      .card-num { font-size: 16px; }
      .card-title { font-size: 17px; }
      .hero::before, .hero::after { height: 20px; }
    }
  </style>
</head>
<body>

<section class="hero">
  <div class="hero-inner">
    <div class="hero-eyebrow">Self-guided film walks</div>
    <h1>Walk through cinema</h1>
    <div class="hero-rule"></div>
    <div class="hero-desc">Real locations &mdash; real films</div>
  </div>
</section>

<div id="itinerary-list">
  <p class="state-msg">Loading&hellip;</p>
</div>

<script>
(async () => {
  const list = document.getElementById('itinerary-list');

  let itineraries;
  try {
    const res = await fetch('itineraries.json');
    if (!res.ok) throw new Error();
    itineraries = await res.json();
  } catch {
    list.innerHTML = '<p class="state-msg">Could not load itineraries.json</p>';
    return;
  }

  if (!itineraries.length) {
    list.innerHTML = '<p class="state-msg">No itineraries yet.</p>';
    return;
  }

  list.innerHTML = '';
  itineraries.forEach((it, i) => {
    const a = document.createElement('a');
    a.className = 'itinerary-card';
    a.href = `itinerary.html?walk=${encodeURIComponent(it.file)}`;
    a.style.animationDelay = `${i * 80}ms`;
    a.innerHTML = `
      <div class="card-num">${String(i + 1).padStart(2, '0')}</div>
      <div class="card-body">
        <div class="card-city">${it.city}</div>
        <div class="card-title">${it.walk_name}</div>
        <div class="card-meta">
          <span class="card-meta-item">${it.duration_minutes} min</span>
          <span class="card-meta-sep">/</span>
          <span class="card-meta-item">${it.distance_km} km</span>
          <span class="card-meta-sep">/</span>
          <span class="card-meta-item">${it.stops} stops</span>
        </div>
      </div>
      <div class="card-arrow">&#8594;</div>
    `;
    list.appendChild(a);
  });
})();
</script>

</body>
</html>
